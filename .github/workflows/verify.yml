name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI_FIXTURE: '1'
      VITE_SUPABASE_URL: https://school-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_abcdefghijklmnopqrstuv_12345678
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/guard-env.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # CD: setelah verify lulus pada push ke main, deploy ke Preview Vercel (bukan produksi).
  # Produksi menunggu migration hosted diterapkan; lihat docs/CI_RUNBOOK.md.
  deploy-preview:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Periksa secret Vercel
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Secret VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID belum disetel; deploy Preview dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      # VITE_SUPABASE_URL dan VITE_SUPABASE_PUBLISHABLE_KEY diambil dari env Preview proyek Vercel.
      - name: Ambil konfigurasi Preview
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@65.14.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@65.14.0 build --token="$VERCEL_TOKEN"
      - name: Deploy Preview
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(npx --yes vercel@65.14.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
